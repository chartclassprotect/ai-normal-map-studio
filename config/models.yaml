# Model registry. Each entry maps a name to weights + expected IO.
models:
  nmgen_v4:
    path: models/weights/nmgen_v4.onnx
    input: [1, 1, 512, 512]     # NCHW, single-channel height
    output: [1, 3, 512, 512]    # NCHW, RGB tangent-space normal
    normalization: [-1, 1]
    license: Apache-2.0
    sha256: "PLACEHOLDER_SHA256_NMGEN_V4"

  nmgen_v4_diffuse:
    path: models/weights/nmgen_v4_diffuse.onnx
    input: [1, 3, 512, 512]     # NCHW, RGB diffuse
    output: [1, 3, 512, 512]
    normalization: [-1, 1]
    license: Apache-2.0
    sha256: "PLACEHOLDER_SHA256_NMGEN_V4_DIFFUSE"

  detail_booster_v2:
    path: models/weights/detail_booster_v2.onnx
    input: [1, 3, 512, 512]
    output: [1, 3, 512, 512]
    normalization: [-1, 1]
    license: CC-BY-4.0
    sha256: "PLACEHOLDER_SHA256_DETAIL_BOOSTER_V2"